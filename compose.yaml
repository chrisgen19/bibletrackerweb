# Local development database only. Production uses Vercel Marketplace Postgres.
services:
  db:
    image: postgres:18-alpine
    container_name: bibletrackerweb-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: bibletracker
      POSTGRES_PASSWORD: bibletracker
      POSTGRES_DB: bibletracker
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bibletracker -d bibletracker"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
